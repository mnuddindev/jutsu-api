version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: jutsu-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jutsu-network

volumes:
  redis_data:

networks:
  jutsu-network:
    driver: bridge

