  /az-list:
    get:
      consumes:
      - application/json
      description: Returns paginated anime rows for a given category or genre route
        (e.g. /api/genre/action, /api/top-airing)
      parameters:
      - default: 1
        description: Page number (must be >= 1)
        example: 1
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Category results
          schema:
            $ref: '#/definitions/handler.CategoryResponse'
        "400":
          description: Invalid page parameter
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
