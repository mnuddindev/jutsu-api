definitions:
  handler.CacheCheck:
    properties:
      response_time_ms:
        type: integer
      status:
        type: string
    type: object
  handler.Checks:
    properties:
      cache:
        $ref: '#/definitions/handler.CacheCheck'
      external_sources:
        $ref: '#/definitions/handler.ExternalSourcesCheck'
    type: object
  handler.ExternalSourcesCheck:
    properties:
      anime_provider:
        additionalProperties:
          type: string
        type: object
    type: object
  handler.HealthResponse:
    properties:
      checks:
        $ref: '#/definitions/handler.Checks'
      service:
        type: string
      status:
        type: string
      timestamp:
