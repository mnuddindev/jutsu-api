basePath: /api
definitions:
  handler.CacheCheck:
    properties:
      response_time_ms:
        type: integer
      status:
        type: string
    type: object
  handler.CategoryResponse:
    properties:
      results:
        properties:
          data: {}
          totalPages:
            example: 10
            type: integer
        type: object
      success:
        example: true
        type: boolean
    type: object
  handler.Checks:
    properties:
      cache:
        $ref: '#/definitions/handler.CacheCheck'
      external_sources:
        $ref: '#/definitions/handler.ExternalSourcesCheck'
    type: object
  handler.ErrorResponse:
    description: Standard error response
    properties:
      message:
        example: Error message here
        type: string
      success:
        example: false
        type: boolean
    type: object
  handler.ExternalSourcesCheck:
    properties:
      anime_provider:
        additionalProperties:
          type: string
        type: object
    type: object
  handler.HealthResponse:
    properties:
      checks:
        $ref: '#/definitions/handler.Checks'
      service:
        type: string
      status:
        type: string
      timestamp:
        type: string
      uptime:
        type: string
      version:
        type: string
    type: object
  handler.SearchResponse:
    properties:
      results:
        properties:
          data: {}
          totalPage:
            example: 5
            type: integer
        type: object
      success:
        example: true
        type: boolean
    type: object
  handler.SuccessResponse:
    description: Standard success response
    properties:
      cached:
        example: false
        type: boolean
      results: {}
      success:
        example: true
        type: boolean
    type: object
host: localhost:8080
info:
  contact:
    email: support@jutsu-api.com
    name: Jutsu API Support
    url: https://github.com/mnuddindev/jutsu-api
  description: |-
    High-Performance Anime Streaming API built with Go
    A blazing-fast, production-ready RESTful API for anime streaming platforms

    **Features:**
    - Complete anime data (episodes, metadata, streaming sources)
    - Advanced search and filtering
    - Schedule management and notifications
    - Character and voice actor information
    - User watchlist support
    - Optimized caching with Redis

    **Disclaimer:**
    This API does not store any files. It only links to media hosted on 3rd party services.
    This API is explicitly made for educational purposes only.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Jutsu API
  version: 1.0.0
paths:
  /:
    get:
      consumes:
      - application/json
      description: Returns combined home page data including spotlights, trending,
        top 10, schedule, and category previews
      produces:
      - application/json
      responses:
        "200":
          description: Home page data
          schema:
            additionalProperties: true
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
      summary: Get home page data
      tags:
      - Home
  /actors/{id}:
    get:
      consumes:
      - application/json
      description: Returns detailed information about a specific voice actor and their
        roles
      parameters:
      - description: Voice actor ID
        example: gakuto-kajiwara-534
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Voice actor details
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Missing path parameter
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: No voice actor found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "502":
          description: Failed to fetch voice actor
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get voice actor details
      tags:
      - Characters
