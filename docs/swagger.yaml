  /filter:
    get:
      consumes:
      - application/json
      description: Filter anime using the same query options as search (type, status,
        rating, genres, dates, etc.)
      parameters:
      - description: Anime type (tv, movie, ova, etc.)
        in: query
        name: type
        type: string
      - description: Status (ongoing, completed, etc.)
        in: query
        name: status
        type: string
      - description: Rating filter
        in: query
        name: rated
        type: string
      - description: Minimum score
        in: query
        name: score
        type: string
      - description: Season filter
        in: query
        name: season
        type: string
      - description: Language (sub, dub)
        in: query
        name: language
        type: string
      - description: Comma-separated genre IDs
        example: 1,2,3
        in: query
        name: genres
        type: string
      - description: Sort order
        in: query
        name: sort
        type: string
      - description: Start year
        in: query
        name: sy
        type: string
      - description: Start month
        in: query
        name: sm
        type: string
      - description: Start day
        in: query
        name: sd
        type: string
      - description: End year
        in: query
        name: ey
        type: string
      - description: End month
        in: query
        name: em
        type: string
      - description: End day
        in: query
        name: ed
        type: string
      - description: Search keyword
        in: query
        name: keyword
        type: string
      - default: 1
        description: Page number
        example: 1
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Filter results
          schema:
            $ref: '#/definitions/handler.SearchResponse'
        "404":
          description: Requested page exceeds total available pages
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "502":
          description: Failed to filter
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Filter anime
      tags:
      - Search
